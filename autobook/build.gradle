plugins {
    id 'fabric-loom' version '1.19.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def javaRelease = (project.findProperty('java_release') ?: '21').toString().toInteger()
def modmenuVersion = (project.findProperty('modmenu_version') ?: '').toString().trim()
// 1.21.11 起按键分类改为 KeyMapping.Category；1.21.5-1.21.8 仍为字符串。
def modernKeyCategory = project.minecraft_version == '1.21.11'

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/main/java-21']
        java.srcDirs += modernKeyCategory ? 'src/main/java-keycategory' : 'src/main/java-keylegacy'
        if (modmenuVersion) {
            java.srcDirs += 'src/main/java-modmenu'
        }
    }
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    if (modmenuVersion) {
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', project.minecraft_version
    inputs.property 'java', javaRelease
    inputs.property 'loader_min', project.findProperty('loader_min_version') ?: project.loader_version
    inputs.property 'modmenu', modmenuVersion
    def modmenuEntry = modmenuVersion
        ? ',\n    "modmenu": [\n      "com.mcbookwriter.autobook.gui.AutoBookModMenuIntegration"\n    ]'
        : ''
    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft': project.minecraft_version,
            'java': javaRelease,
            'loader_min': project.findProperty('loader_min_version') ?: project.loader_version,
            'modmenu_entry': modmenuEntry
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
}

tasks.test {
    useJUnitPlatform()
}
