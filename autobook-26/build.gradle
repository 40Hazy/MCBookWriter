plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def javaRelease = (project.findProperty('java_release') ?: '25').toString().toInteger()

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java.srcDirs = ['../autobook/src/main/java', '../autobook/src/main/java-26']
        resources.srcDirs = ['../autobook/src/main/resources']
    }
    test {
        java.srcDirs = ['../autobook/src/test/java']
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', project.minecraft_version
    inputs.property 'java', javaRelease
    inputs.property 'loader_min', project.findProperty('loader_min_version') ?: project.loader_version
    def modmenuVersion = (project.findProperty('modmenu_version') ?: '').toString().trim()
    inputs.property 'modmenu', modmenuVersion
    def modmenuEntry = modmenuVersion
        ? ',\n    "modmenu": [\n      "com.mcbookwriter.autobook.gui.AutoBookModMenuIntegration"\n    ]'
        : ''
    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft': project.minecraft_version,
            'java': javaRelease,
            'loader_min': project.findProperty('loader_min_version') ?: project.loader_version,
            'modmenu_entry': modmenuEntry
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
}

tasks.test {
    useJUnitPlatform()
}
